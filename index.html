<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>Unity Web Player | BirdSheet</title>
    <link rel="shortcut icon" href="TemplateData/favicon.ico">
    <link rel="stylesheet" href="TemplateData/style.css">
    <link rel="manifest" href="manifest.webmanifest">
  </head>
  <body>
    <div id="unity-container">
      <canvas id="unity-canvas" width=960 height=600 tabindex="-1"></canvas>
      <div id="unity-loading-bar">
        <div id="unity-logo"></div>
        <div id="unity-progress-bar-empty">
          <div id="unity-progress-bar-full"></div>
        </div>
      </div>
      <div id="unity-warning"> </div>
      <!-- Hidden inline too: right after an upgrade the old worker may still serve an older style.css -->
      <button id="update-banner" type="button" style="display: none">A new version of Bird Sheet is ready. Tap to update.</button>
    </div>
    <script>
      // On phones Unity types through its own text box. The sheet's fields show the text and caret themselves
      // (Hide Mobile Input), so the box stays focused for the keyboard but invisible at the top of the screen.
      new MutationObserver(function (mutations) {
        mutations.forEach(function (mutation) {
          mutation.addedNodes.forEach(function (node) {
            if (node.input && node.okButton)
              node.style.cssText += "top: 0; bottom: auto; opacity: 0; pointer-events: none;";
          });
        });
      }).observe(document.body, { childList: true });

      // Registered once the build has loaded, so the worker's precache reuses the files just downloaded
      function registerServiceWorker(unityInstance) {
        if (!("serviceWorker" in navigator)) return;

        var hadController = !!navigator.serviceWorker.controller;
        navigator.serviceWorker.register("ServiceWorker.js", { updateViaCache: "none" }).then(function (registration) {
          // A home-screen app resumes without reloading, so check for a new deploy whenever it comes back into view
          document.addEventListener("visibilitychange", function () {
            if (document.visibilityState === "visible") registration.update();
          });
        });

        // A newer build's worker has taken over while this page is still running the old build
        navigator.serviceWorker.addEventListener("controllerchange", function () {
          if (hadController) showUpdateBanner(unityInstance);
          hadController = true;
        });
      }

      function showUpdateBanner(unityInstance) {
        var banner = document.querySelector("#update-banner");
        banner.style.display = "block";
        banner.onclick = function () {
          banner.disabled = true;
          // Save the sheet before reloading; PlayerPrefs reach IndexedDB asynchronously, hence the short wait
          try { unityInstance.SendMessage("SheetCanvas", "SaveSheet"); } catch (e) { }
          setTimeout(function () { window.location.reload(); }, 1000);
        };
      }

      var container = document.querySelector("#unity-container");
      var canvas = document.querySelector("#unity-canvas");
      var loadingBar = document.querySelector("#unity-loading-bar");
      var progressBarFull = document.querySelector("#unity-progress-bar-full");
      var warningBanner = document.querySelector("#unity-warning");

      // Shows a temporary message banner/ribbon for a few seconds, or
      // a permanent error message on top of the canvas if type=='error'.
      // If type=='warning', a yellow highlight color is used.
      // Modify or remove this function to customize the visually presented
      // way that non-critical warnings and error messages are presented to the
      // user.
      function unityShowBanner(msg, type) {
        function updateBannerVisibility() {
          warningBanner.style.display = warningBanner.children.length ? 'block' : 'none';
        }
        var div = document.createElement('div');
        div.innerHTML = msg;
        warningBanner.appendChild(div);
        if (type == 'error') div.style = 'background: red; padding: 10px;';
        else {
          if (type == 'warning') div.style = 'background: yellow; padding: 10px;';
          setTimeout(function() {
            warningBanner.removeChild(div);
            updateBannerVisibility();
          }, 5000);
        }
        updateBannerVisibility();
      }

      var buildUrl = "Build";
      var loaderUrl = buildUrl + "/d27ce5a0284f763166d552af04b8346d.loader.js";
      var config = {
        arguments: [],
        dataUrl: buildUrl + "/4e07a3bc44cee0fca2c6700ebc768d93.data",
        frameworkUrl: buildUrl + "/ff13cde4e9a2509b567ea3bc71c0ccfc.framework.js",
        codeUrl: buildUrl + "/60817475fb2aa43412114f7bca755e9f.wasm",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "DefaultCompany",
        productName: "BirdSheet",
        productVersion: "1.1.0",
        showBanner: unityShowBanner,
        // errorHandler: function(err, url, line) {
        //    alert("error " + err + " occurred at line " + line);
        //    // Return 'true' if you handled this error and don't want Unity
        //    // to process it further, 'false' otherwise.
        //    return true;
        // },
      };

      // By default Unity keeps WebGL canvas render target size matched with
      // the DOM size of the canvas element (scaled by window.devicePixelRatio)
      // Set this to false if you want to decouple this synchronization from
      // happening inside the engine, and you would instead like to size up
      // the canvas DOM size and WebGL render target sizes yourself.
      // config.matchWebGLToCanvasSize = false;

      if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
        // Mobile device style: fill the whole browser client area with the game canvas:
        var meta = document.createElement('meta');
        meta.name = 'viewport';
        meta.content = 'width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes';
        document.getElementsByTagName('head')[0].appendChild(meta);
      }


      loadingBar.style.display = "block";

      var script = document.createElement("script");
      script.src = loaderUrl;
      script.onload = () => {
        createUnityInstance(canvas, config, (progress) => {
          progressBarFull.style.width = 100 * progress + "%";
        }).then((unityInstance) => {
          loadingBar.style.display = "none";
          registerServiceWorker(unityInstance);
        }).catch((message) => {
          alert(message);
        });
      };
      document.body.appendChild(script);
    </script>
  </body>
</html>
